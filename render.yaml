services:
  - type: web
    name: collabdocs-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard from MongoDB Atlas
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # Set in Render Dashboard to your Vercel frontend URL, e.g. https://collabdocs.vercel.app
    healthCheckPath: /api/health

